<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 175" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b3b3b"/>
    </marker>
  </defs>
  <rect width="760" height="175" fill="#ffffff"/>

  <!-- player -->
  <rect x="8" y="48" width="92" height="46" rx="23" fill="#f3f3f3" stroke="#3b3b3b" stroke-width="1.4"/>
  <text x="54" y="76" text-anchor="middle" font-size="14" fill="#1d1d1d">Player</text>

  <!-- UI -->
  <rect x="140" y="38" width="160" height="66" rx="8" fill="#f3f3f3" stroke="#3b3b3b" stroke-width="1.4"/>
  <text x="220" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d1d1d">Streamlit chat</text>
  <text x="220" y="86" text-anchor="middle" font-size="11.5" fill="#555">version1/app.py</text>

  <!-- Gemini -->
  <rect x="482" y="24" width="270" height="94" rx="8" fill="#ede7fb" stroke="#5b46a8" stroke-width="1.6"/>
  <text x="617" y="56" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c1f6b">Gemini — Game Master</text>
  <text x="617" y="78" text-anchor="middle" font-size="11.5" fill="#2c1f6b">decides what happens</text>
  <text x="617" y="96" text-anchor="middle" font-size="11.5" fill="#2c1f6b">and narrates it</text>

  <!-- history -->
  <rect x="140" y="130" width="160" height="36" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-dasharray="4 3"/>
  <text x="220" y="153" text-anchor="middle" font-size="11.5" fill="#444">chat history = only memory</text>
  <line x1="220" y1="104" x2="220" y2="130" stroke="#8a8a8a" stroke-dasharray="4 3"/>

  <!-- arrows -->
  <line x1="100" y1="71" x2="138" y2="71" stroke="#3b3b3b" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="300" y1="56" x2="480" y2="56" stroke="#3b3b3b" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="390" y="34" text-anchor="middle" font-size="11" fill="#333">prompt: room, rules,</text>
  <text x="390" y="48" text-anchor="middle" font-size="11" fill="#b3261e" font-weight="bold">all codes + solution</text>
  <text x="390" y="72" text-anchor="middle" font-size="11" fill="#333">+ full chat history</text>
  <line x1="482" y1="96" x2="302" y2="96" stroke="#3b3b3b" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="390" y="114" text-anchor="middle" font-size="11" fill="#333">free-text reply</text>
  <text x="390" y="128" text-anchor="middle" font-size="11" fill="#333">(win if it contains [ESCAPED])</text>
</svg>
