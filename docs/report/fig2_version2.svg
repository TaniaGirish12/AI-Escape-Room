<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 278" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b3b3b"/>
    </marker>
  </defs>
  <rect width="760" height="278" fill="#ffffff"/>

  <!-- button path (top) -->
  <path d="M160 70 L160 30 L465 30 L465 68" fill="none" stroke="#3b3b3b" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="312" y="22" text-anchor="middle" font-size="11" fill="#333">button click = structured action (skips the interpreter)</text>

  <!-- boxes -->
  <rect x="4" y="74" width="74" height="46" rx="23" fill="#f3f3f3" stroke="#3b3b3b" stroke-width="1.4"/>
  <text x="41" y="102" text-anchor="middle" font-size="13" fill="#1d1d1d">Player</text>

  <rect x="104" y="70" width="112" height="54" rx="8" fill="#f3f3f3" stroke="#3b3b3b" stroke-width="1.4"/>
  <text x="160" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d1d1d">Streamlit UI</text>
  <text x="160" y="111" text-anchor="middle" font-size="10.5" fill="#555">version2/app.py</text>

  <rect x="250" y="70" width="122" height="54" rx="8" fill="#ede7fb" stroke="#5b46a8" stroke-width="1.5"/>
  <text x="311" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c1f6b">Interpreter</text>
  <text x="311" y="111" text-anchor="middle" font-size="10.5" fill="#2c1f6b">Gemini, JSON mode</text>

  <rect x="400" y="66" width="130" height="62" rx="8" fill="#fbefd2" stroke="#9a6b00" stroke-width="2"/>
  <text x="465" y="92" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#5a3e00">Game engine</text>
  <text x="465" y="111" text-anchor="middle" font-size="10.5" fill="#5a3e00">Python rules</text>

  <rect x="558" y="70" width="196" height="54" rx="8" fill="#ede7fb" stroke="#5b46a8" stroke-width="1.5"/>
  <text x="656" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c1f6b">Narrator + output check</text>
  <text x="656" y="111" text-anchor="middle" font-size="10.5" fill="#2c1f6b">Gemini tells the story</text>

  <!-- main arrows -->
  <line x1="78" y1="97" x2="102" y2="97" stroke="#3b3b3b" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="216" y1="97" x2="248" y2="97" stroke="#3b3b3b" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="232" y="62" text-anchor="middle" font-size="10" fill="#333">text</text>
  <line x1="372" y1="97" x2="398" y2="97" stroke="#3b3b3b" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="386" y="62" text-anchor="middle" font-size="10" fill="#333">actions</text>
  <line x1="530" y1="97" x2="556" y2="97" stroke="#3b3b3b" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="544" y="62" text-anchor="middle" font-size="10" fill="#333">result</text>

  <!-- return path -->
  <path d="M656 124 L656 152 L160 152 L160 126" fill="none" stroke="#3b3b3b" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="300" y="168" text-anchor="middle" font-size="10.5" fill="#333">checked reply (no leaked code, no fake escape)</text>

  <!-- data stores under the engine -->
  <line x1="465" y1="128" x2="465" y2="186" stroke="#8a8a8a"/>
  <line x1="365" y1="186" x2="575" y2="186" stroke="#8a8a8a"/>
  <line x1="365" y1="186" x2="365" y2="196" stroke="#8a8a8a"/>
  <line x1="470" y1="186" x2="470" y2="196" stroke="#8a8a8a"/>
  <line x1="575" y1="186" x2="575" y2="196" stroke="#8a8a8a"/>
  <rect x="312" y="196" width="106" height="44" rx="6" fill="#ffffff" stroke="#8a8a8a"/>
  <text x="365" y="215" text-anchor="middle" font-size="11" fill="#333">game_config.json</text>
  <text x="365" y="231" text-anchor="middle" font-size="10" fill="#666">room as data</text>
  <rect x="424" y="196" width="92" height="44" rx="6" fill="#ffffff" stroke="#8a8a8a"/>
  <text x="470" y="215" text-anchor="middle" font-size="11" fill="#333">game state</text>
  <text x="470" y="231" text-anchor="middle" font-size="10" fill="#666">dictionary</text>
  <rect x="522" y="196" width="106" height="44" rx="6" fill="#ffffff" stroke="#8a8a8a"/>
  <text x="575" y="215" text-anchor="middle" font-size="11" fill="#333">secret codes</text>
  <text x="575" y="231" text-anchor="middle" font-size="10" fill="#666">random, kept apart</text>

  <!-- status panel reads state -->
  <path d="M470 240 L470 256 L120 256 L120 126" fill="none" stroke="#8a8a8a" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="300" y="271" text-anchor="middle" font-size="10" fill="#666">UI reads the state: status panel, inventory, journal</text>
</svg>
